name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - name: Fast test gate (2 minute budget)
        shell: pwsh
        run: |
          $start = Get-Date
          npm run test:coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seconds = ((Get-Date) - $start).TotalSeconds
          Write-Host ("Fast suite: {0:N1}s" -f $seconds)
          if ($seconds -gt 120) { throw "Fast suite exceeded the 120 s budget" }
      - run: npm run build
      # Keep the audit gate, but run it after the tests so a dependency advisory
      # cannot hide test/coverage results. The current tree has known advisories
      # (electron-builder/global-agent chain); resolve those deliberately.
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage
          if-no-files-found: ignore

  e2e:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:release
