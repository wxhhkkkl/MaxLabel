name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - name: Fast test gate (2 minute budget)
        shell: pwsh
        run: |
          $start = Get-Date
          npm run test:coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seconds = ((Get-Date) - $start).TotalSeconds
          Write-Host ("Fast suite: {0:N1}s" -f $seconds)
          if ($seconds -gt 120) { throw "Fast suite exceeded the 120 s budget" }
      - run: npm run build
      # Run the audit after tests so a dependency advisory cannot hide test
      # results. The remaining moderates are dev-only electron-builder toolchain
      # advisories (not shipped in the app); high/critical still block.
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage
          if-no-files-found: ignore

  e2e:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build macOS artifacts (unsigned unless secrets are configured)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - name: Record signing status
        if: always()
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            status="macOS: signed with CSC_LINK; notarization not configured"
          else
            status="macOS: unsigned (no CSC_LINK secret); notarization not configured"
          fi
          echo "$status" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p release
          echo "$status" > release/SIGNING-STATUS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-artifacts
          path: app/release
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install USB build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: npm ci
      - run: npm run build
      - name: Build Linux artifacts (unsigned)
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Record signing status
        if: always()
        run: |
          status="Linux: unsigned (Linux artifacts are not code-signed)"
          echo "$status" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p release
          echo "$status" > release/SIGNING-STATUS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-artifacts
          path: app/release
          if-no-files-found: ignore

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:release
